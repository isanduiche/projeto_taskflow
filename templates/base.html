<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow Corp - Sistema Interno</title>
    <style>
        body { font-family: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', monospace; margin: 0; padding: 0; background-color: #ececec}
        header { background-color: darkred; color: white; padding: 15px 30px;  }
        h6{ background-color: #b50101; padding: 5px 10px; margin-block: 0.1px}
        nav a { color: indianred; text-decoration: none; margin-right: 20px; font-weight: bold }
        nav a:hover{color: lightpink}
        main { padding: 30px; max-width: 900px; margin: 0 auto; background: #ffffff; margin-top: 30px;}
        footer { text-align: center; padding: 15px; border-radius: 6px; margin-bottom: 10px }
        card { border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; margin-bottom: 10px }
        p{ color: darkred; font-weight: bold }
    </style>
</head>
<body>
<header>
    <h1 style="margin:0 0 10px; font-size: 20px; "> TaskFlow Corp | Gestão Interna </h1>
    <nav>
        <a href="{{ url_for('index') }}">Início</a>
        <a href="{{ url_for('criar_atividade') }}"> Criar Atividade </a>
        <a href="{{ url_for('listar_atividades') }}">Listar Atividade</a>
        <a href="{{ url_for('pessoa') }}">Perfil Colaborador</a>
    </nav>
</header>
<h6 style="color: #b50101"> jarvis que coisa mais linda </h6>

<main>
    {% block conteudo %}
    {% endblock conteudo %}
</main>
</body>
</html>
